# 클라우드 버전(Cloudflare Worker): 테스트 + main 배포
# 배포에 필요한 설정 (docs/CLOUD-SETUP.md)
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GH_APP_CLIENT_SECRET, GH_APP_PRIVATE_KEY(테스트 실행기)
#   Variables: GH_APP_CLIENT_ID, GH_APP_SLUG, GH_APP_ID(테스트 실행기)
# (GitHub는 GITHUB_로 시작하는 이름을 허용하지 않아서 GH_APP_* 로 둔다)
name: 클라우드 Worker

on:
  push:
    paths: ['worker/**', 'web/**', 'scripts/**', 'tests/fake-github.mjs', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', 'web/**', 'scripts/**', 'tests/fake-github.mjs', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'Yeobi1124/godot-web-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Worker 통합 테스트 (wrangler dev + 가짜 GitHub)
        run: npm test
        working-directory: worker

  # 엔진 조각(약 100MB)을 GitHub Pages에 올린다. 한국에서 Cloudflare 무료 플랜보다 빠르게 받기 위함.
  # Pages가 꺼져 있으면(Settings → Pages → Source: GitHub Actions) 이 작업만 실패하고, 에디터는 Worker에서 조각을 받는다.
  engine-mirror:
    needs: test
    if: github.repository == 'Yeobi1124/godot-web-editor' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Godot 웹 에디터 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: godot-web-editor-${{ hashFiles('scripts/build.sh') }}
      - name: 엔진 조각 만들기 (dist-mirror)
        run: scripts/build-worker.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-mirror
      - id: pages
        uses: actions/deploy-pages@v4

  deploy:
    needs: [test, engine-mirror]
    # 미러 배포가 실패해도 Worker는 배포한다 (그때는 미러 없이)
    if: always() && github.repository == 'Yeobi1124/godot-web-editor' && needs.test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: 설정 확인
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다 (docs/CLOUD-SETUP.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Godot 웹 에디터 캐시
        if: steps.cfg.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: godot-web-editor-${{ hashFiles('scripts/build.sh') }}
      - name: 빌드 (dist-worker)
        if: steps.cfg.outputs.skip != 'true'
        env:
          ENGINE_MIRROR: ${{ needs.engine-mirror.result == 'success' && needs.engine-mirror.outputs.url || '' }}
        run: scripts/build-worker.sh
      - run: npm ci
        if: steps.cfg.outputs.skip != 'true'
        working-directory: worker
      - name: 배포
        if: steps.cfg.outputs.skip != 'true'
        working-directory: worker
        run: |
          npx wrangler deploy \
            --var "GITHUB_CLIENT_ID:${{ vars.GH_APP_CLIENT_ID }}" \
            --var "GITHUB_APP_SLUG:${{ vars.GH_APP_SLUG }}" \
            --var "GITHUB_APP_ID:${{ vars.GH_APP_ID }}" \
            --var "RUNNER_REPO:${{ github.repository }}"
      - name: 비밀값 등록 (GitHub App client secret)
        if: steps.cfg.outputs.skip != 'true' && env.GH_APP_CLIENT_SECRET != ''
        working-directory: worker
        run: printf '%s' "$GH_APP_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET
      - name: 비밀값 등록 (GitHub App 비공개 키, 테스트 실행기)
        if: steps.cfg.outputs.skip != 'true' && env.GH_APP_PRIVATE_KEY != ''
        working-directory: worker
        run: printf '%s' "$GH_APP_PRIVATE_KEY" | npx wrangler secret put GITHUB_APP_PRIVATE_KEY
